<!-- Define para o navegador que este documento é um HTML5 moderno -->
<!DOCTYPE html>

<!-- Tag principal que envolve todo o documento, definindo a linguagem para português do Brasil -->
<html lang="pt-BR">
  <head>
    <!-- Define a codificação de caracteres como UTF-8 (permite acentos, ç, emojis, etc.) -->
    <meta charset="UTF-8" />
    
    <!-- Configura a tela para ser responsiva em celulares e tablets (ajusta a escala da tela) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Define o título que aparece na aba do navegador -->
    <title>Agenda dos Formadores</title>
  </head>
  <body>
    <!-- A "div root" é o container vazio onde o React vai injetar toda a interface do sistema -->
    <div id="root"></div>
    
    <!-- Carrega o arquivo JavaScript/React principal (main.jsx) como um módulo moderno do navegador -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
